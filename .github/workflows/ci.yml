name: CI & Release

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Expo ESLint)
        run: npm run lint

      - name: Build frontend (Expo export)
        run: npm run build

  release:
    name: Publish Release
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if version tag exists
        id: version_check
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if git tag --list "v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists — skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog for this version
        if: steps.version_check.outputs.skip != 'true'
        id: changelog
        run: |
          node -e '
            const fs = require("fs");
            const ver = process.argv[1];
            const text = fs.readFileSync("CHANGELOG.md", "utf8");
            const startHeader = "## [" + ver + "]";
            const startIndex = text.indexOf(startHeader);
            let result = "";
            if (startIndex !== -1) {
              const afterStart = text.slice(startIndex + startHeader.length);
              const nextHeaderIndex = afterStart.search(/\n## \[/);
              const section = nextHeaderIndex === -1 ? afterStart : afterStart.slice(0, nextHeaderIndex);
              result = section.replace(/^[^\n]*\n+/, "").trim();
            }
            const output = [
              "content<<EOF",
              result || ("Release v" + ver),
              "EOF"
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, output + "\n");
          ' "${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        if: steps.version_check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ver.outputs.version }}"
          name: "v${{ steps.ver.outputs.version }}"
          body: ${{ steps.changelog.outputs.content }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
